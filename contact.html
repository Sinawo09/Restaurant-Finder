<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="description" content="Send a message to Restaurant Finder.">
  <title>Contact | Restaurant Finder</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="theme-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Restaurant Finder home"><span class="brand-mark" aria-hidden="true">R</span>Restaurant Finder</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation"><span></span><span></span></button>
    <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header> 

  <main class="contact-main">
    <section class="contact-intro"><p class="eyebrow">We'd love to hear from you</p><h1>Say hello<span class="heading-period">.</span></h1><p>Have a question or suggestion? Send us a note.</p></section>
    <form class="contact-form" id="contact-form" novalidate>
      <div class="form-field"><label for="full-name">Full Name</label><input id="full-name" name="name" type="text" autocomplete="name" aria-describedby="name-error" required><span class="field-error" id="name-error"></span></div>
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required><span class="field-error" id="email-error"></span></div>
      <div class="form-field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" aria-describedby="subject-error" required><span class="field-error" id="subject-error"></span></div>
      <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" rows="5" aria-describedby="message-error" required></textarea><span class="field-error" id="message-error"></span></div>
      <button class="button button-dark" type="submit">Send message <span aria-hidden="true">&rarr;</span></button>
      <p class="form-success" id="form-success" role="status" hidden>Thank you! Your message has been submitted successfully.</p>
    </form>
  </main>

  <footer class="site-footer"><a class="brand brand-footer" href="index.html"><span class="brand-mark" aria-hidden="true">R</span>Restaurant Finder</a><p>Made for finding your next good meal.</p><span>&copy; <span class="current-year"></span> Restaurant Finder</span></footer>
</body>
</html>
